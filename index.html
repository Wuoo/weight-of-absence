<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f5f3ed" />
  <link rel="icon" href="data:," />
  <title>空白也有重量 · 一封情书</title>
</head>
<body>
  <main>
    <aside class="intro">
      <span class="eyebrow">LOVE LETTERS · 001</span>
      <h1>空白也有重量</h1>
      <p>有些习惯，<br>还在替你撑伞。</p>
      <div class="controls">
        <button id="replay" aria-label="重新播放">重新读一遍 <span>↗</span></button>
        <button id="pause" aria-label="暂停播放">暂停</button>
      </div>
      <button id="sound" class="sound">声音 · 关闭</button>
      <p class="hint">等信里的线长成一把伞。<br>左右拖动，让伞偏向你。</p>
      <div class="progress"><i></i></div>
      <span class="time">00:00 / 00:15</span>
    </aside>
    <section class="art" aria-label="动态情书：文字向没有写下的称呼处缓慢下沉">
      <canvas id="canvas"></canvas>
      <div class="loading">正在展开信纸…</div>
    </section>
  </main>
  <audio id="audio" src="./soundtrack.wav" preload="none"></audio>
  <script type="module" src="/src/v2.js"></script>
</body>
</html>
